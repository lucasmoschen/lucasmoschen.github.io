  - name: Description
    value: My research combines mathematical modelling, control theory, and numerical
      analysis to study probability distributions and interacting stochastic systems.
      I develop feedback control methods for Fokker-Planck, McKean-Vlasov,
      and Wasserstein gradient-flow models based on spectral properties, with current work on coupled populations,
      sampling, and effective dynamics. My earlier research concerns constrained vaccination
      policies on networks and statistical inference for correlated proportions.
