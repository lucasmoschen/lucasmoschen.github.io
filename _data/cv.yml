- title: Research Experience
  type: time_table
  contents:
  - title: Control of Probability Distributions and Interacting Systems
    institution: Imperial College London
    year: 2024 - present
    description:
    - Supervised by Grigorios A. Pavliotis and Dante Kalise.
    - title: Completed research
      contents:
      - <a href="/projects/2025-control-fokker-planck/">Control and stabilisation
        of probability distributions</a> — spectral optimal control, feedback stabilisation,
        and local convexification; three related papers listed below.
    - title: Current projects
      contents:
      - <a href="/projects/2025-control-mckean-vlasov/">Feedback control of mean-field
        systems</a> — coupled populations, partial actuation, and unbounded domains.
      - <a href="/projects/2026-feedback-sampling/">Feedback control for sampling</a>
        — particle implementations and the computational cost of approaching target
        distributions.
      - <a href="/projects/2026-control-effective-dynamics/">Control and Effective
        Dynamics</a> — reduced feedback design through reaction coordinates and the
        effect of model-reduction errors.
